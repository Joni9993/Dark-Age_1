<!-- ARTBOARD: Forschung (Overlay) ========================================== -->
<div class="scr">

  <div style="position:absolute;inset:0;z-index:1"><!--MAP--></div>
  <div class="scrim"></div>
  <div class="bg-scan" style="z-index:3;opacity:.45"></div>

  <div class="lay" style="z-index:4;gap:14px;padding:18px 14px 14px">

    <div class="row" style="gap:10px">
      <svg class="ic-32"><use href="#i-scroll"></use></svg>
      <div class="col grow" style="gap:2px">
        <span class="h1" style="font-size:22px">Forschung</span>
        <span class="lbl">Pfeiler Feudalismus</span>
      </div>
      <span class="row" style="gap:5px;padding:6px 9px;background:#0d0b09;border:2px solid #0a0806;
            box-shadow:inset 2px 2px 0 #0c0907, inset -2px -2px 0 #241d16;">
        <svg class="ic-14"><use href="#i-wood"></use></svg><span class="num">11</span>
      </span>
    </div>

    <!-- Fortschritt -->
    <div class="pf pf--flat col" style="padding:10px;gap:8px">
      <div class="row">
        <span class="lbl grow">Fortschritt</span>
        <span class="lbl lbl--gold">1 / 3</span>
      </div>
      <div class="row" style="gap:4px">
        <span style="flex:1;height:12px;background:#c98a10;box-shadow:inset 2px 2px 0 #f0cf6a, inset -2px -2px 0 #7a5205"></span>
        <span style="flex:1;height:12px;background:#241d16;box-shadow:inset 2px 2px 0 #33281c, inset -2px -2px 0 #0c0907"></span>
        <span style="flex:1;height:12px;background:#241d16;box-shadow:inset 2px 2px 0 #33281c, inset -2px -2px 0 #0c0907"></span>
      </div>
    </div>

    <div class="col" style="gap:12px">

      <!-- gekauft -->
      <div class="pf pf--dead row" style="padding:12px;gap:12px">
        <div class="col" style="width:40px;flex:0 0 40px;align-items:center;gap:5px">
          <svg class="ic-24" style="opacity:.4"><use href="#i-shield"></use></svg>
          <span class="lbl" style="font-size:8px;color:#3f3931">Stufe 1</span>
        </div>
        <div class="col grow" style="gap:5px">
          <span class="h3" style="color:#6d6558">Plattenpanzer</span>
          <span class="micro" style="color:#4f4941">Basis-Schwerter erhalten +5 Max HP.</span>
          <span class="row" style="gap:5px;margin-top:2px">
            <svg class="ic-12" style="color:#5cb85c"><use href="#i-check"></use></svg>
            <span class="lbl" style="color:#5cb85c">Erforscht</span>
          </span>
        </div>
      </div>

      <!-- verfügbar -->
      <div class="pf pf--gold row" style="padding:12px;gap:12px">
        <span class="stud stud--tl"></span><span class="stud stud--tr"></span>
        <span class="stud stud--bl"></span><span class="stud stud--br"></span>
        <div class="col" style="width:40px;flex:0 0 40px;align-items:center;gap:5px">
          <svg class="ic-24"><use href="#i-star"></use></svg>
          <span class="lbl lbl--gold" style="font-size:8px">Stufe 2</span>
        </div>
        <div class="col grow" style="gap:5px">
          <span class="h3">Waffenmeister</span>
          <span class="micro" style="color:#a2917a">Neu rekrutierte Einheiten starten bereits als Veteran (+1 Schaden).</span>
          <div class="row" style="gap:8px;margin-top:4px">
            <span class="badge badge--cost"><svg class="ic-12"><use href="#i-wood"></use></svg>7 Holz</span>
            <span class="grow"></span>
            <button class="btn btn--primary btn--sm" style="width:auto;padding:0 14px">Erforschen</button>
          </div>
        </div>
      </div>

      <!-- gesperrt -->
      <div class="pf row" style="padding:12px;gap:12px;opacity:.72">
        <div class="col" style="width:40px;flex:0 0 40px;align-items:center;gap:5px">
          <svg class="ic-24"><use href="#i-lock"></use></svg>
          <span class="lbl" style="font-size:8px">Stufe 3</span>
        </div>
        <div class="col grow" style="gap:5px">
          <span class="h3" style="color:#8a7e6e">Doppelschuss</span>
          <span class="micro">Parthershot (Kamelreiter) kostet 0 Holz.</span>
          <span class="row" style="gap:5px;margin-top:2px">
            <svg class="ic-12"><use href="#i-lock"></use></svg>
            <span class="lbl">Braucht Stufe 2</span>
          </span>
        </div>
      </div>
    </div>

    <button class="btn btn--ghost" style="margin-top:auto">Schließen</button>

  </div>
</div>
