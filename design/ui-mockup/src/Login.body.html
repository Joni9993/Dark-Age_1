<!-- ARTBOARD: Login / Registrierung ========================================= -->
<div class="scr">
  <div class="bg-hex"></div><div class="bg-vig"></div><div class="bg-scan"></div>

  <div class="lay" style="gap:0;align-items:center;justify-content:center">

    <!-- Wappen (Pixel-Zeichnung, ersetzt Icon.png als <img>) -->
    <svg width="116" height="116" viewBox="0 0 24 24" shape-rendering="crispEdges"
         style="filter:drop-shadow(0 4px 0 rgba(0,0,0,.8))">
      <g fill="#2c303d">
        <rect x="8" y="2" width="8" height="1"/><rect x="6" y="3" width="12" height="1"/>
        <rect x="5" y="4" width="14" height="9"/><rect x="6" y="13" width="12" height="1"/>
        <rect x="7" y="14" width="10" height="2"/><rect x="8" y="16" width="8" height="1"/>
        <rect x="9" y="17" width="6" height="2"/><rect x="10" y="19" width="4" height="1"/>
        <rect x="11" y="20" width="2" height="1"/>
      </g>
      <g fill="#171a22">
        <rect x="16" y="4" width="3" height="9"/><rect x="14" y="13" width="4" height="1"/>
        <rect x="13" y="14" width="4" height="2"/><rect x="13" y="16" width="3" height="1"/>
      </g>
      <g fill="#9fabbc">
        <rect x="8" y="2" width="8" height="1"/><rect x="6" y="3" width="2" height="1"/>
        <rect x="5" y="4" width="1" height="9"/>
      </g>
      <g fill="#c98a10">
        <rect x="11" y="5" width="2" height="10"/><rect x="8" y="10" width="8" height="1"/>
        <rect x="10" y="15" width="4" height="1"/>
      </g>
      <g fill="#e8b84a">
        <rect x="11" y="4" width="2" height="1"/><rect x="11" y="6" width="1" height="7"/>
      </g>
    </svg>

    <div class="wm" style="font-size:36px;margin-top:18px">DARK AGES</div>
    <div class="lbl" style="margin-top:10px">Hex-Strategie · Zug um Zug · Asynchron</div>

    <div class="pf col" style="width:100%;margin-top:34px;padding:16px;gap:14px">
      <span class="stud stud--tl"></span><span class="stud stud--tr"></span>
      <span class="stud stud--bl"></span><span class="stud stud--br"></span>

      <div class="field">
        <span class="lbl">Ingame-Name</span>
        <div class="input input--focus">Jonathan<span class="caret"></span></div>
      </div>

      <div class="field">
        <span class="lbl">Passwort</span>
        <div class="input row" style="gap:8px">
          <svg class="ic-14"><use href="#i-lock"></use></svg>
          <span class="input--ph" style="letter-spacing:3px">••••••••</span>
        </div>
      </div>

      <button class="btn btn--primary" style="margin-top:2px">Einloggen</button>
    </div>

    <p class="micro" style="margin-top:16px;text-align:center;max-width:300px">
      Neu hier? Wähle einen Namen und ein Passwort —<br>dein Account wird automatisch erstellt.
    </p>

  </div>

  <div style="position:absolute;right:16px;bottom:14px;z-index:3">
    <span class="lbl" style="color:#3f3931">v3.7.0</span>
  </div>
</div>
